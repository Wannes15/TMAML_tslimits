dataset:
  name: electricity
  meta_train_path: data/electricity/meta_sets/Seed42_electricity_seriesBased_meta_train_cumulative_20ids_0508.pkl
  meta_val_path: data/electricity/meta_sets/Seed42_electricity_seriesBased_meta_val_85ids_0508.pkl
  target: log_power_usage
  max_encoder_length: 144
  min_encoder_length: 0
  max_prediction_length: 24
  min_prediction_length: 24
  randomize_length: false

model:
  name: tft
  hidden_size: 160
  attention_head_size: 4
  dropout: 0.1
  output_size: 9
  optimizer: ranger
  learning_rate: 0.001
  anonymize_series_id: true

method: tmaml

tmaml:
  max_epochs: 150
  K_support: 6
  inner_lr: 0.001
  outer_lr: 0.0001
  inner_steps: 10
  meta_batch_size: 20
  inner_grad_clip: 100
  support_window_size: 24
  sampling: entity_diverse
  unified_support: true
  val_check_interval: 5

tag: "20ids_ilr0.001_olr0.0001_MB20_IS10"
